name: Publish

on:
  workflow_dispatch:
    inputs:
      versionType:
        type: choice
        description: '<major|minor|patch>'
        required: true
        default: 'minor'
        options:
          - major
          - minor
          - patch
jobs:
  publish:
    name: Publish ${{ inputs.versionType }} release
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository, and to open pull requests.
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ vars.NODE_VERSION}}
          cache: 'yarn'
      - id: update-version
        shell: bash
        name: Update package.json version
        # Use npm because yarn is for some reason not able to output only the version name
        run: |
          echo "version=$(npm version --no-git-tag-version "$VERSION_TYPE")" >> $GITHUB_OUTPUT
          git add .
        env:
          VERSION_TYPE: ${{ inputs.versionType }}
      - name: Create version bump branch
        shell: bash
        run: |
          git checkout -b "version-bump/$VERSION"
          git push origin "version-bump/$VERSION"
        env:
          VERSION: ${{ steps.update-version.outputs.version }}
      - uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        name: Commit new version
        with:
          commit_message: "🤖 Release ${{steps.update-version.outputs.version}}"
          repo: ${{ github.repository }}
          branch: version-bump/${{steps.update-version.outputs.version}}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Open version bump pull request
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "version-bump/$VERSION" \
            --title "🤖 Release $VERSION" \
            --body "Automated version bump to $VERSION."
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update-version.outputs.version }}
      - name: Checkout release branch
        shell: bash
        run: |
          git checkout -b "release/$VERSION"
          git push origin "release/$VERSION"
        env:
          VERSION: ${{ steps.update-version.outputs.version }}
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn run build
      - name: Install prod dependencies
        run: rm -rf node_modules && yarn install --production --frozen-lockfile
      - name: Add node_modules and dist
        shell: bash
        run: |
          git add --force dist/
          git add --force node_modules/
      - uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        id: commit
        name: Commit node_modules and dist
        with:
          commit_message: "🤖 Build ${{steps.update-version.outputs.version}}"
          repo: ${{ github.repository }}
          branch: release/${{steps.update-version.outputs.version}}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create tag
        id: tag
        shell: bash
        run: |
          echo "Tagging $COMMIT_HASH"
          git fetch
          git tag "$VERSION" "$COMMIT_HASH"
          git push origin "$VERSION"
        env:
          VERSION: ${{ steps.update-version.outputs.version }}
          COMMIT_HASH: ${{ steps.commit.outputs.commit-hash }}
      - name: 'Build Changelog'
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6
        with:
            token: '${{ github.token }}'
            configurationJson: |
              {
                "categories": [
                  {
                    "title": "## 🚀 Features",
                    "labels": ["feature"]
                  },
                  {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix"]
                  },
                  {
                      "title": "## 💬 Other",
                      "labels": ["other"]
                  },
                  {
                      "title": "## 📦 Dependencies",
                      "labels": ["dependencies"]
                  },
                  {
                      "title": "## ❓ Uncategorized",
                      "labels": []
                  }
                ]
              }
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          body: ${{steps.build_changelog.outputs.changelog}}
          name: ${{steps.update-version.outputs.version}}
          tag_name: ${{steps.update-version.outputs.version}}
          target_commitish: ${{ steps.commit.outputs.commit-hash }}
